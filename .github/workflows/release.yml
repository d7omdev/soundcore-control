name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

jobs:
  appimage:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            libdbus-1-dev \
            libgl1-mesa-dev \
            libwayland-dev \
            libx11-dev \
            libxcursor-dev \
            libxi-dev \
            libxkbcommon-dev \
            libxrandr-dev \
            pkg-config

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - name: Install linuxdeploy
        run: |
          curl -Lo /usr/local/bin/linuxdeploy \
            https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          curl -Lo /usr/local/bin/linuxdeploy-plugin-appimage \
            https://github.com/linuxdeploy/linuxdeploy-plugin-appimage/releases/download/continuous/linuxdeploy-plugin-appimage-x86_64.AppImage
          chmod +x /usr/local/bin/linuxdeploy /usr/local/bin/linuxdeploy-plugin-appimage

      - name: Build AppImage
        run: packaging/build-appimage.sh

      # Commits land directly on main here rather than through PRs, so
      # generate_release_notes (which summarizes merged PRs) has nothing to
      # list. Build the notes from commit messages between tags instead.
      - name: Generate changelog
        run: |
          previous_tag="$(git tag --sort=-creatordate | grep -A1 "^${GITHUB_REF_NAME}\$" | tail -n1)"
          if [ "$previous_tag" = "$GITHUB_REF_NAME" ]; then
            previous_tag=""
          fi
          {
            echo "## Changes"
            echo
            if [ -n "$previous_tag" ]; then
              git log --pretty='- %s' "${previous_tag}..${GITHUB_REF_NAME}"
            else
              git log --pretty='- %s' "$GITHUB_REF_NAME"
            fi
          } >release-notes.md
          cat release-notes.md

      - name: Publish release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          files: "*.AppImage"
          body_path: release-notes.md
